name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n scripts/*.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Check README media sizes
        run: node scripts/check-readme-media.mjs
      - name: Dry run
        run: |
          DRY_RUN=1 ./scripts/configure-branch-protection.sh example-org example-repo
